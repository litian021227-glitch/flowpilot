services:
  - type: web
    name: flowpilot
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.deepseek.com
      - key: AI_MODEL
        value: deepseek-flash
      - key: AI_TIMEOUT_MS
        value: "30000"
      - key: AI_MAX_RETRIES
        value: "2"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://flowpilot-9hrw.onrender.com
      - key: REQUEST_LIMIT
        value: "120"
      - key: REQUEST_BODY_LIMIT_BYTES
        value: "2097152"
      - key: KNOWLEDGE_FILE_LIMIT_BYTES
        value: "10485760"
      - key: KNOWLEDGE_STORAGE_BUCKET
        value: flowpilot-knowledge
      - key: WEBHOOK_SIGNING_SECRET
        sync: false
      - key: INVITATION_BASE_URL
        value: https://flowpilot-9hrw.onrender.com
      - key: INVITATION_EXPIRES_HOURS
        value: "168"
      - key: REQUIRE_AUTH
        value: "false"
